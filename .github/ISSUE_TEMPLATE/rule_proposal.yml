name: Rule Proposal
description: Propose a new Semgrep rule or Joern CPG script
labels: ["rule-proposal"]

body:
  - type: markdown
    attributes:
      value: |
        Proposing a new detection rule? Fill this out and we'll review it quickly.
        See [CONTRIBUTING.md](../../CONTRIBUTING.md) for rule standards.

  - type: dropdown
    id: type
    attributes:
      label: Rule type
      options:
        - Semgrep rule
        - Joern CPG script
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Target language(s)
      placeholder: "Java, Go, Ruby, ..."
    validations:
      required: true

  - type: input
    id: cwe
    attributes:
      label: CWE / CVE
      placeholder: "CWE-89, CWE-502, CVE-2024-XXXXX"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Vulnerability description
      description: What does this rule detect? Why is it exploitable?
    validations:
      required: true

  - type: textarea
    id: pattern
    attributes:
      label: Vulnerable code pattern
      description: A minimal code snippet that triggers the rule.
      render: python
    validations:
      required: true

  - type: textarea
    id: rule
    attributes:
      label: Proposed rule YAML (optional)
      description: If you've written the rule, paste it here.
      render: yaml

  - type: textarea
    id: references
    attributes:
      label: References
      description: CVE links, blog posts, research papers, etc.
