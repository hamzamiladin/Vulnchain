rules:
  # ── Cloud Provider Keys ──────────────────────────────────────────────────────

  - id: secret-aws-access-key
    languages: [generic]
    severity: ERROR
    message: >
      AWS Access Key ID detected in source. Rotate immediately and store in
      AWS Secrets Manager, environment variables, or IAM roles.
    metadata:
      cwe: CWE-798
      owasp: "A07:2021 – Identification and Authentication Failures"
    pattern-regex: "(?i)AKIA[0-9A-Z]{16}"

  - id: secret-aws-secret-key
    languages: [generic]
    severity: ERROR
    message: >
      AWS Secret Access Key pattern detected. Rotate immediately.
    metadata:
      cwe: CWE-798
      owasp: "A07:2021 – Identification and Authentication Failures"
    pattern-regex: "(?i)aws[_\\-\\.]?secret[_\\-\\.]?(access)?[_\\-\\.]?key[\"'\\s]*[=:][\"'\\s]*[A-Za-z0-9/+]{40}"

  - id: secret-gcp-api-key
    languages: [generic]
    severity: ERROR
    message: >
      Google Cloud API key detected. Restrict it in the GCP console and
      rotate if exposed publicly.
    metadata:
      cwe: CWE-798
      owasp: "A07:2021 – Identification and Authentication Failures"
    pattern-regex: "AIza[0-9A-Za-z\\-_]{35}"

  - id: secret-gcp-service-account
    languages: [generic]
    severity: ERROR
    message: >
      Google Cloud service account key JSON detected in source.
    metadata:
      cwe: CWE-798
    pattern-regex: '"type":\\s*"service_account"'

  # ── GitHub / GitLab ──────────────────────────────────────────────────────────

  - id: secret-github-pat
    languages: [generic]
    severity: ERROR
    message: >
      GitHub Personal Access Token detected. Revoke at github.com/settings/tokens.
    metadata:
      cwe: CWE-798
      owasp: "A07:2021 – Identification and Authentication Failures"
    pattern-either:
      - pattern-regex: "ghp_[A-Za-z0-9]{36}"
      - pattern-regex: "github_pat_[A-Za-z0-9_]{82}"
      - pattern-regex: "gho_[A-Za-z0-9]{36}"
      - pattern-regex: "ghs_[A-Za-z0-9]{36}"

  - id: secret-gitlab-token
    languages: [generic]
    severity: ERROR
    message: >
      GitLab personal/project/group access token detected. Revoke immediately.
    metadata:
      cwe: CWE-798
    pattern-regex: "glpat-[A-Za-z0-9\\-_]{20}"

  # ── Payment Services ─────────────────────────────────────────────────────────

  - id: secret-stripe-key
    languages: [generic]
    severity: ERROR
    message: >
      Stripe API key detected. Revoke at dashboard.stripe.com/apikeys.
    metadata:
      cwe: CWE-798
      owasp: "A07:2021 – Identification and Authentication Failures"
    pattern-either:
      - pattern-regex: "sk_live_[0-9a-zA-Z]{24,}"
      - pattern-regex: "rk_live_[0-9a-zA-Z]{24,}"

  - id: secret-stripe-test-key
    languages: [generic]
    severity: WARNING
    message: >
      Stripe test key in source — ensure this is never used in production
      and not committed to public repos.
    metadata:
      cwe: CWE-798
    pattern-either:
      - pattern-regex: "sk_test_[0-9a-zA-Z]{24,}"
      - pattern-regex: "pk_test_[0-9a-zA-Z]{24,}"

  # ── Communication APIs ───────────────────────────────────────────────────────

  - id: secret-slack-webhook
    languages: [generic]
    severity: ERROR
    message: >
      Slack incoming webhook URL detected. Rotate at api.slack.com/apps.
    metadata:
      cwe: CWE-798
    pattern-regex: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"

  - id: secret-slack-token
    languages: [generic]
    severity: ERROR
    message: >
      Slack API token detected. Revoke and regenerate.
    metadata:
      cwe: CWE-798
    pattern-either:
      - pattern-regex: "xoxb-[0-9]{11}-[0-9]{11}-[A-Za-z0-9]{24}"
      - pattern-regex: "xoxp-[0-9]{11}-[0-9]{11}-[0-9]{11}-[A-Za-z0-9]{32}"
      - pattern-regex: "xapp-[0-9]+-[A-Z0-9]+-[0-9]+-[A-Za-z0-9]+"

  - id: secret-sendgrid-key
    languages: [generic]
    severity: ERROR
    message: >
      SendGrid API key detected. Revoke at app.sendgrid.com/settings/api_keys.
    metadata:
      cwe: CWE-798
    pattern-regex: "SG\\.[A-Za-z0-9_\\-]{22}\\.[A-Za-z0-9_\\-]{43}"

  - id: secret-twilio-key
    languages: [generic]
    severity: ERROR
    message: >
      Twilio credentials detected. Revoke at console.twilio.com.
    metadata:
      cwe: CWE-798
    pattern-either:
      - pattern-regex: "SK[a-f0-9]{32}"
      - pattern-regex: "AC[a-f0-9]{32}"

  # ── Private Keys ─────────────────────────────────────────────────────────────

  - id: secret-private-key-pem
    languages: [generic]
    severity: ERROR
    message: >
      Private key (PEM format) detected in source. Never commit private keys.
      Use a secrets manager or environment variable.
    metadata:
      cwe: CWE-321
      owasp: "A02:2021 – Cryptographic Failures"
    pattern-either:
      - pattern-regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
      - pattern-regex: "-----BEGIN CERTIFICATE-----"

  # ── Credentials in URLs ──────────────────────────────────────────────────────

  - id: secret-credentials-in-url
    languages: [generic]
    severity: ERROR
    message: >
      Credentials embedded in URL (Basic Auth format). Never store credentials in URLs.
      Use header-based authentication or environment variables.
    metadata:
      cwe: CWE-312
      owasp: "A02:2021 – Cryptographic Failures"
    pattern-regex: "https?://[^:@\\s]+:[^:@\\s]+@[^\\s]+"

  # ── Generic High-Entropy Secrets ─────────────────────────────────────────────

  - id: secret-jwt-hardcoded
    languages: [generic]
    severity: ERROR
    message: >
      Hardcoded JWT or bearer token detected. Rotate immediately.
    metadata:
      cwe: CWE-798
    pattern-regex: "eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}"

  - id: secret-anthropic-key
    languages: [generic]
    severity: ERROR
    message: >
      Anthropic API key detected. Revoke at console.anthropic.com/settings/keys.
    metadata:
      cwe: CWE-798
    pattern-regex: "sk-ant-[A-Za-z0-9\\-_]{40,}"

  - id: secret-openai-key
    languages: [generic]
    severity: ERROR
    message: >
      OpenAI API key detected. Revoke at platform.openai.com/account/api-keys.
    metadata:
      cwe: CWE-798
    pattern-regex: "sk-[A-Za-z0-9]{48}"

  - id: secret-huggingface-token
    languages: [generic]
    severity: ERROR
    message: >
      Hugging Face token detected.
    metadata:
      cwe: CWE-798
    pattern-regex: "hf_[A-Za-z0-9]{34,}"
